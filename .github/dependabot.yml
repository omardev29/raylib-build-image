# Pinning by SHA without automated bumps rots into "pinned to something with a
# known CVE". Dependabot opens the PRs; a human still decides to merge.
#
# NOTE: the `docker` ecosystem is deliberately absent. Dependabot's proxy cannot
# authenticate anonymous pulls of `library/ubuntu` from Docker Hub and fails the
# job on every run ("UNAUTHORIZED: authentication required"). A permanently red
# job is worse than no job. The base image digest is bumped by hand instead, and
# the template's tools/versions_check.sh is what stops it drifting silently.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

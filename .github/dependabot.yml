# Pinning by SHA without automated bumps rots into "pinned to something with a
# known CVE". Dependabot opens the PRs; a human still decides to merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # Watches the FROM line. The digest pin means Dependabot proposes the new
  # digest for ubuntu:24.04 rather than silently drifting.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "image"

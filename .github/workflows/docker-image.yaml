# Builds the CI build-image (Dockerfile) and pushes it to GHCR.
# The raylib_multiplatform repo runs its Linux jobs inside this image, so
# toolchains are frozen and nothing is downloaded at job time.
#
# Pull requests build the image for both architectures but do NOT push, so a
# broken Dockerfile is caught before it reaches main instead of after.
#
# All third-party actions are pinned by full commit SHA and run on Node 22+
# (GitHub is deprecating Node 20 actions).

name: Build & push CI image

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'python/**'
      - 'smoke/**'
      - '.github/workflows/docker-image.yaml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'python/**'
      - 'smoke/**'
      - '.github/workflows/docker-image.yaml'
  workflow_dispatch:

# Two pushes in a row must not race to overwrite :latest, and the loser must
# not win. Tags are never built here, so cancelling in-progress runs is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The runner's own preinstalled SDKs, which a docker build never uses.
      # Both platforms' layers live on this disk while they build (amd64 alone
      # is 8.3 GB uncompressed since the Gradle home and LLVM went in, a GB
      # more than before, and the warm-up's four Android builds need room on
      # top), plus the compressed copies a push makes. Running out shows up as
      # a build that dies half an hour in with "no space left on device", so
      # make the room first and print what there is.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up QEMU (multiarch)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${owner}/raylib-build" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
          # Attestations turn the pushed manifest into an OCI index with extra
          # entries, which makes GHCR display bogus `unknown/unknown` platforms.
          provenance: false
          sbom: false
          # Registry cache, not type=gha: this image is ~10 GB and mode=max
          # blows straight through the 10 GB per-repo Actions cache limit,
          # evicting itself on every run.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, steps.img.outputs.name) || '' }}

      # The immutable reference the consuming repo should pin. A tag can be
      # moved; a digest cannot.
      - name: Report immutable digest
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          {
            echo "## Build image published"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Pin this in \`raylib_multiplatform\`'s \`ci.yml\` (\`BUILD_IMAGE\`)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${DIGEST}"

      # Proves the image actually contains what the Dockerfile claims, on BOTH
      # architectures CI really pulls.
      #
      # This used to verify linux/amd64 only, which left the arm64 manifest --
      # the one the `arm64` and `drm-arm64` jobs run inside -- published without
      # ever having been executed. QEMU is already set up further up, so running
      # the foreign image costs a step and not a runner.
      #
      # The manifest's own `arch` field is compared against the platform we
      # asked for: that is what catches a multiarch index wired to the wrong
      # layers, which no amount of `cmake --version` would notice.
      - name: Verify published image (amd64 + arm64)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # The manifest list is checked BY DIGEST, which is what the consumers
          # pin; the containers are run BY TAG, because `docker run --platform`
          # against a digest reference fails with "cannot overwrite digest"
          # (the per-platform image it pulls has a different digest from the
          # list it was asked for). The tag was pushed by the same build step
          # and resolves to that same list.
          DIGEST_REF="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}"
          REF="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}"
          echo "::group::manifest list at the published digest"
          docker manifest inspect "$DIGEST_REF" | tee /tmp/manifest.json
          grep -q '"architecture": "amd64"' /tmp/manifest.json
          grep -q '"architecture": "arm64"' /tmp/manifest.json
          echo "::endgroup::"
          for plat in amd64 arm64; do
            echo "::group::verify linux/${plat}"
            docker run --rm --platform "linux/${plat}" -e EXPECT_ARCH="${plat}" "$REF" bash -lc '
              set -eu
              cat /etc/raylib-build-image.json
              grep -q "\"arch\": \"${EXPECT_ARCH}\"" /etc/raylib-build-image.json
              cmake --version | head -1
              ninja --version
              zig version
              emcc --version | head -1
              gcc --version | head -1
              aarch64-linux-gnu-gcc --version | head -1
              objdump --version | head -1
              upx --version | head -1
              clang-format --version
              python3 -c "import yaml, PIL, tomllib; print(\"python deps ok\")"
              # The test toolchain (phase 15/16): LLVM 18 tools, cppcheck,
              # Mull, the Python test tools, and the manifest keys that
              # versions_check.sh compares against the framework pins.
              llvm-cov --version | head -2
              llvm-profdata --version | head -2
              cppcheck --version
              mull-runner-18 --version | head -1
              test -f /usr/lib/mull-ir-frontend-18
              python3 -c "import hypothesis, mutmut, pytest; print(\"hypothesis\", hypothesis.__version__, \"pytest\", pytest.__version__)"
              for key in llvm cppcheck mull hypothesis mutmut pytest; do
                grep -q "\"${key}\": \"[^\"]" /etc/raylib-build-image.json
              done
              echo "OK: linux/${EXPECT_ARCH} verified"
            '
            echo "::endgroup::"
          done
          # Android, butler and actionlint are amd64-only by construction (see
          # their install steps). Assert the presence there AND the documented
          # absence on arm64, so the difference stays a decision rather than
          # turning into a 2 a.m. surprise.
          docker run --rm --platform linux/amd64 "$REF" bash -lc '
            set -eu
            test -d "$ANDROID_NDK_HOME"
            butler -V
            actionlint --version
            # The Gradle home that lets the Android job build --offline.
            cat "$GRADLE_USER_HOME/rmp-warm.properties"
            for key in gradle agp play_services_ads gradle_warm_commit; do
              grep -q "\"${key}\": \"[^\"]" /etc/raylib-build-image.json
            done
            echo "OK: amd64-only tools present"
          '
          docker run --rm --platform linux/arm64 "$REF" bash -lc '
            set -eu
            if [ -d "$ANDROID_NDK_HOME" ]; then
              echo "FAIL: arm64 image unexpectedly carries the Android NDK" >&2
              exit 1
            fi
            if [ -e "$GRADLE_USER_HOME/rmp-warm.properties" ] || grep -q "\"gradle\":" /etc/raylib-build-image.json; then
              echo "FAIL: arm64 image unexpectedly carries a warmed Gradle home" >&2
              exit 1
            fi
            echo "OK: arm64 documented differences hold"
          '
          echo "OK: image verified on amd64 and arm64"

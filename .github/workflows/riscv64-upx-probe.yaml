# TEMPORARY diagnosis (removed before merge): which UPX-packed riscv64 binaries
# start on a real RISC-V board. The riscv64 image's verify step found a packed
# C++ probe dying with "Trace/breakpoint trap" on RISE, where QEMU runs it.
name: riscv64 UPX probe (temporary)
on:
  pull_request:
    paths: ['.github/workflows/riscv64-upx-probe.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    steps:
      - name: The machine
        run: |
          uname -a; cat /proc/cpuinfo | grep -m3 -E "isa|uarch|mmu" || true; gcc --version | head -1; cmake --version | head -1
      - name: UPX 5.2.0 from source
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-src.tar.xz -o upx.tar.xz
          echo "af99e526d5759de94412aea1104d5e4ca406cb725295f8633ecc9e843dc1ce1c  upx.tar.xz" | sha256sum -c -
          tar -xJf upx.tar.xz
          cmake -S upx-5.2.0-src -B upx-build -DCMAKE_BUILD_TYPE=Release -DUPX_CONFIG_DISABLE_GITREV=ON -DUPX_CONFIG_DISABLE_SELF_PACK_TEST=ON > /dev/null
          cmake --build upx-build -j"$(nproc)" > /dev/null
          /tmp/upx-build/upx --version | head -1
      - name: Which packed binaries start
        run: |
          set -uo pipefail
          cd /tmp
          printf '#include <stdio.h>\nint main(void){puts("C_OK");return 0;}\n' > c.c
          printf '#include <cstdio>\n#include <span>\n#include <vector>\nint main(){std::vector<int> v{1,2,3};std::span<int> s(v);std::printf("CXX_OK %%zu\\n",s.size());}\n' > cxx.cpp
          gcc -O2 c.c -o c_pie
          gcc -O2 -no-pie c.c -o c_nopie
          gcc -O2 -static c.c -o c_static
          g++ -std=c++20 -O2 cxx.cpp -o cxx_pie
          g++ -std=c++20 -O2 -static-pie cxx.cpp -o cxx_static_pie || true
          for b in c_pie c_nopie c_static cxx_pie cxx_static_pie; do
            [ -f "$b" ] || continue
            for opts in "" "--best --lzma" "--nrv2b" "--nrv2e"; do
              out="${b}_$(echo "$opts" | tr -d ' -')"; cp "$b" "$out"
              if /tmp/upx-build/upx -q $opts "$out" > /dev/null 2>&1; then
                if res=$("./$out" 2>&1); then echo "RUNS   $b [$opts]: $res"; else echo "DIES   $b [$opts]: rc=$? $res"; fi
              else echo "NOPACK $b [$opts]"; fi
            done
          done
